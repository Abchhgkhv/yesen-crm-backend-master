name: Deploy Yesen CRM Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/your-user/yesen-crm

            git pull --ff-only origin main

            sudo docker build -t yesen-crm-backend:latest .

            sudo docker rm -f yesen-backend || true

            sudo docker run -d \
              --name yesen-backend \
              --env-file .env.production \
              -e NODE_ENV=production \
              -p 5000:5001 \
              --restart unless-stopped \
              yesen-crm-backend:latest

            sleep 5

            sudo docker ps --filter name=yesen-backend

            curl -fsS http://localhost:5000/health
