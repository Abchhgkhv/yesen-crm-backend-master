
name: Deploy Yesen CRM Backend

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2 and MicroK8s
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu

            cd /home/ubuntu/yesen-crm-backend-master

            echo "Updating backend source code"
            git fetch origin main
            git reset --hard origin/main

            IMAGE_TAG=${{ github.sha }}
            IMAGE_NAME="docker.io/library/yesen-backend:${IMAGE_TAG}"

            echo "Building backend Docker image"
            sudo docker build -t "yesen-backend:${IMAGE_TAG}" .

            echo "Exporting Docker image"
            sudo docker save "yesen-backend:${IMAGE_TAG}" \
              -o /tmp/yesen-backend.tar

            echo "Importing image into MicroK8s"
            sudo microk8s ctr image import /tmp/yesen-backend.tar

            sudo rm -f /tmp/yesen-backend.tar

            echo "Updating Kubernetes deployment"
            sudo microk8s kubectl set image \
              deployment/yesen-backend \
              "yesen-backend=${IMAGE_NAME}"

            echo "Waiting for rollout"
            sudo microk8s kubectl rollout status \
              deployment/yesen-backend \
              --timeout=180s

            echo "Checking backend health"
            for i in $(seq 1 10); do
              if sudo microk8s kubectl run backend-health-check \
                --rm -i --restart=Never \
                --image=curlimages/curl:latest \
                --image-pull-policy=IfNotPresent \
                --command -- curl --fail --silent --show-error \
                --max-time 5 http://yesen-backend:5001/health; then
                echo "Backend health check passed"
                exit 0
              fi

              echo "Waiting for backend..."
              sleep 5
            done

            echo "Backend health check failed"
            exit 1
