
name: Deploy Yesen CRM Backend with Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend using Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Ansible controller and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ANSIBLE_CONTROLLER_HOST }}
          username: ${{ secrets.ANSIBLE_CONTROLLER_USER }}
          key: ${{ secrets.ANSIBLE_CONTROLLER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/yesen-ansible
            ansible-playbook -i inventory.ini deploy-backend.yml
